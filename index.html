<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completionist List</title>
  <meta name="description" content="Мой список закрытия игр: условия закрытия, прогресс и отчёты.">
  <!-- Fandom и другие вики отдают заглушку вместо картинки, если видят чужой Referer -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c0e13">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=8a129faf32">
</head>
<body>
  <!-- Сцена: фон главной меняется на стартовый кадр игры под курсором; через неё идёт бесшовный вход в игру -->
  <div id="stage" aria-hidden="true"></div>

  <!-- Главная: только поиск и список -->
  <main id="list-view" class="wrap">
    <h1 class="sr-only">Completionist List</h1>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Поиск игры…" aria-label="Поиск игры" autocomplete="off">
    </div>
    <div id="list" class="game-list"></div>
  </main>

  <article id="game-view" class="game-view" hidden></article>

  <dialog id="lightbox" class="lightbox" aria-label="Просмотр изображения">
    <button class="lb-btn lb-close" type="button" aria-label="Закрыть">×</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Предыдущее">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Следующее">›</button>
  </dialog>

  <script src="assets/fx.js?v=8a129faf32"></script>
  <script src="assets/app.js?v=8a129faf32"></script>
</body>
</html>
