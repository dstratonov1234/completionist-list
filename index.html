<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completionist List</title>
  <meta name="description" content="Мой список игр: пройдено на 100%, в процессе и в планах.">
  <!-- Fandom и другие вики отдают заглушку вместо картинки, если видят чужой Referer -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c0e13">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="list-view">
    <header class="site-header" id="site-header">
      <div class="wrap">
        <div class="brand">
          <h1>Completionist&nbsp;List</h1>
          <p class="tagline">Игры, которые закрыты навсегда, — и те, что ещё впереди.</p>
        </div>
        <dl class="stats" id="stats"></dl>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <nav class="tabs" id="tabs" aria-label="Статусы"></nav>
        <input class="search" id="search" type="search" placeholder="Поиск игры…" aria-label="Поиск игры" autocomplete="off">
      </div>
      <section id="list" class="grid" aria-live="polite"></section>
    </main>
  </div>

  <article id="game-view" class="game-view" hidden></article>

  <footer class="site-footer wrap">
    <span id="updated"></span>
  </footer>

  <dialog id="lightbox" class="lightbox" aria-label="Просмотр изображения">
    <button class="lb-btn lb-close" type="button" aria-label="Закрыть">×</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Предыдущее">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Следующее">›</button>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="assets/fx.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
